<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{nonce}}'; style-src 'nonce-{{nonce}}'; img-src 'none'; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
<title>Copilot 对话记录</title>
<style nonce="{{nonce}}">
:root { color-scheme: dark; background: {{background}}; color: {{text}}; font-family: '{{font}}', sans-serif; font-size: 10pt; }
* { box-sizing: border-box; }
html { overflow-y: auto; scrollbar-color: {{border}} {{background}}; scrollbar-width: thin; overflow-anchor: none; }
body { margin: 0; padding: 4px 8px 20px 0; line-height: 1.6; overflow-wrap: anywhere; }
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: {{background}}; }
::-webkit-scrollbar-thumb { background: {{border}}; border-radius: 4px; }
article { margin: 0 0 24px; }
.role { margin-bottom: 7px; font-size: 9.5pt; font-weight: bold; color: {{assistant}}; }
.user .role { color: {{user}}; }
.body { margin-left: 20px; }
.user .body { color: {{userText}}; }
.plain, .step { white-space: pre-wrap; }
.plain { margin-bottom: 8px; }
.step { font-size: 8.5pt; color: {{muted}}; margin: 2px 0; }
p { margin: 0 0 10px; }
h1, h2, h3, h4, h5, h6 { line-height: 1.35; margin: 18px 0 8px; font-weight: 600; }
h1 { font-size: 1.65em; } h2 { font-size: 1.4em; } h3 { font-size: 1.2em; }
h4, h5, h6 { font-size: 1em; }
.markdown > :first-child { margin-top: 0; }
ul, ol { padding-left: 24px; margin: 6px 0 12px; }
li { margin: 3px 0; } li > p { margin: 0; }
blockquote { margin: 10px 0; padding-left: 14px; border-left: 3px solid {{border}}; color: {{secondary}}; }
a { color: {{userText}}; text-decoration: underline; cursor: pointer; }
a:focus-visible, button:focus-visible { outline: 1px solid {{user}}; outline-offset: 2px; }
code { font-family: Consolas, 'Courier New', monospace; font-size: .95em; background: {{surface}}; padding: 1px 4px; border-radius: 3px; }
pre { margin: 10px 0; padding: 36px 12px 12px; background: {{surface}}; border: 1px solid {{border}}; position: relative; white-space: pre; overflow-x: auto; overflow-wrap: normal; }
pre code { padding: 0; background: transparent; border-radius: 0; }
.copy { position: absolute; top: 5px; right: 7px; border: 1px solid {{border}}; background: {{background}}; color: {{secondary}}; font: inherit; font-size: 8.25pt; padding: 2px 7px; cursor: pointer; }
.table-wrap { overflow-x: auto; margin: 10px 0; }
table { border-collapse: collapse; font-size: .95em; border: 1px solid #70707e; background: #1a1a20; }
th, td { border: 1px solid #555562; padding: 6px 10px; text-align: left; min-width: 50px; }
th { background: #292930; font-weight: 600; }
tbody tr:nth-child(even) { background: #1f1f26; }
hr { border: 0; border-top: 1px solid {{border}}; margin: 16px 0; }
#empty { color: {{secondary}}; text-align: center; white-space: pre-wrap; padding-top: 75px; }
#empty::before { content: '✦'; display: block; color: {{muted}}; font-size: 20pt; margin-bottom: 12px; }
#done { display: flex; align-items: center; gap: 10px; margin: -8px 0 8px 20px; color: #34d399; font-size: 9pt; }
#done .badge { display: inline-flex; align-items: center; gap: 7px; padding: 3px 12px 3px 4px; border: 1px solid rgba(16, 185, 129, .45); background: rgba(16, 185, 129, .12); border-radius: 999px; font-weight: 600; }
#done .check { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; border-radius: 50%; background: #10b981; color: #0f1714; font-size: 10pt; line-height: 1; }
#done .line { flex: 1; height: 1px; background: linear-gradient(to right, rgba(16, 185, 129, .35), transparent); }
#pending { opacity: .6; }
#pending .role::after { content: ' · 发送中'; font-weight: normal; color: {{muted}}; }
#activity { display: flex; align-items: center; gap: 10px; margin: -6px 0 12px 20px; color: #fcc448; font-size: 9pt; }
#activity .dots { display: inline-flex; align-items: center; gap: 4px; padding: 7px 10px; border-radius: 999px; background: rgba(245, 158, 11, .12); border: 1px solid rgba(245, 158, 11, .35); }
#activity .dots i { width: 6px; height: 6px; border-radius: 50%; background: #f59e0b; animation: vsm-blink 1.2s infinite ease-in-out; }
#activity .dots i:nth-child(2) { animation-delay: .2s; }
#activity .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes vsm-blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="empty" hidden></div>
<main id="transcript" aria-label="Copilot 对话记录"></main>
<article id="pending" class="user" hidden><div class="role">●  你</div><div class="body"><div class="plain"></div></div></article>
<div id="activity" role="status" aria-live="polite" hidden><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="text"></span></div>
<div id="done" role="status" hidden><span class="badge"><span class="check" aria-hidden="true">✔</span><span class="text"></span></span><span class="line"></span></div>
<script nonce="{{nonce}}">
(function () {
    'use strict';
    const root = document.getElementById('transcript');
    const empty = document.getElementById('empty');
    const done = document.getElementById('done');
    const doneText = done.querySelector('.text');
    const pending = document.getElementById('pending');
    const pendingText = pending.querySelector('.plain');
    const activity = document.getElementById('activity');
    const activityText = activity.querySelector('.text');
    const nodes = new Map();
    let revision = -1;
    let generation = -1;
    const allowed = new Set(['P', 'BR', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'UL', 'OL', 'LI',
        'STRONG', 'EM', 'DEL', 'S', 'BLOCKQUOTE', 'PRE', 'CODE', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TH', 'TD',
        'HR', 'A', 'DIV', 'SPAN']);

    function send(type, value) {
        window.chrome.webview.postMessage({ type: type, revision: revision, value: value });
    }

    function safeUrl(value) {
        // 本机附件链接：只允许固定格式的附件编号 / Local attachment links: only ids of the fixed format are allowed
        if (value && /^vsm-attachment:\d{8}-\d{9}-[0-9a-f]{6}$/.test(value)) return value;
        if (!value || value.length > 4096 || !/^https?:\/\//i.test(value) || /[\x00-\x20\x7f]/.test(value)) return null;
        try {
            const url = new URL(value);
            return (url.protocol === 'https:' || url.protocol === 'http:') && url.hostname ? url.href : null;
        } catch (_) { return null; }
    }

    function content(html) {
        // Only host-rendered Markdown enters this inert fragment; allowlisting is defense in depth.
        const template = document.createElement('template');
        template.innerHTML = html;
        for (const element of Array.from(template.content.querySelectorAll('*'))) {
            if (!allowed.has(element.tagName)) {
                element.replaceWith(document.createTextNode(element.tagName === 'IMG' ? (element.getAttribute('alt') || '') : element.textContent));
                continue;
            }
            const href = element.tagName === 'A' ? safeUrl(element.getAttribute('href')) : null;
            const title = element.getAttribute('title');
            const className = element.getAttribute('class');
            const start = element.tagName === 'OL' ? element.getAttribute('start') : null;
            for (const attribute of Array.from(element.attributes)) element.removeAttribute(attribute.name);
            if (href) { element.setAttribute('href', href); element.setAttribute('rel', 'noreferrer noopener'); }
            if (title) element.setAttribute('title', title);
            if (className && /^(plain|step|markdown|language-[\w+-]+)$/.test(className)) element.className = className;
            if (start && /^\d{1,9}$/.test(start)) element.setAttribute('start', start);
        }
        for (const pre of template.content.querySelectorAll('pre')) {
            const code = pre.querySelector('code');
            if (!code) continue;
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'copy';
            button.textContent = '复制代码';
            button.setAttribute('aria-label', '复制代码');
            button.addEventListener('click', function (event) {
                if (!event.isTrusted) return;
                const text = code.textContent;
                if (text.length > 65536) { send('error', '代码超过复制上限（65,536 字符），请手动选择复制。'); return; }
                if (text.length) send('copy', text);
            });
            pre.prepend(button);
        }
        for (const table of template.content.querySelectorAll('table')) {
            const wrapper = document.createElement('div');
            wrapper.className = 'table-wrap';
            table.replaceWith(wrapper);
            wrapper.appendChild(table);
        }
        return template.content;
    }

    function render(data) {
        if (!Number.isSafeInteger(data.revision) || data.revision <= revision || !Array.isArray(data.messages)) return;
        const scroller = document.scrollingElement;
        const oldTop = scroller.scrollTop;
        const oldLeft = scroller.scrollLeft;
        const reset = generation !== data.generation;
        const atBottom = reset || scroller.scrollHeight - oldTop - scroller.clientHeight <= 24;
        let anchor = null;
        let anchorOffset = 0;
        if (!atBottom) {
            for (const node of root.children) {
                const bounds = node.getBoundingClientRect();
                if (bounds.bottom > 0) { anchor = node; anchorOffset = bounds.top; break; }
            }
        }
        if (reset) { root.replaceChildren(); nodes.clear(); }
        revision = data.revision;
        generation = data.generation;
        const retained = new Set();
        let position = 0;
        for (const message of data.messages) {
            retained.add(message.key);
            let node = nodes.get(message.key);
            if (!node) {
                node = document.createElement('article');
                const label = document.createElement('div');
                label.className = 'role';
                const body = document.createElement('div');
                body.className = 'body';
                node.append(label, body);
                nodes.set(message.key, node);
            }
            if (node._html !== message.html || node._user !== message.user) {
                node.className = message.user ? 'user' : 'assistant';
                node.firstChild.textContent = message.user ? '●  你' : '◆  ' + (typeof data.bot === 'string' && data.bot ? data.bot : 'Copilot');
                node.lastChild.replaceChildren(content(message.html));
                node._html = message.html;
                node._user = message.user;
            }
            if (root.children[position] !== node) root.insertBefore(node, root.children[position] || null);
            position++;
        }
        for (const [key, node] of nodes) {
            if (!retained.has(key)) { node.remove(); nodes.delete(key); }
        }
        if (empty.textContent !== data.empty) empty.textContent = data.empty;
        empty.hidden = data.messages.length !== 0 || !data.empty;
        const last = data.messages[data.messages.length - 1];
        const doneValue = typeof data.done === 'string' ? data.done : '';
        if (doneText.textContent !== doneValue) doneText.textContent = doneValue;
        const pendingValue = typeof data.pending === 'string' ? data.pending : '';
        if (pendingText.textContent !== pendingValue) pendingText.textContent = pendingValue;
        pending.hidden = !pendingValue;
        const activityValue = typeof data.activity === 'string' ? data.activity : '';
        if (activityText.textContent !== activityValue) activityText.textContent = activityValue;
        activity.hidden = !activityValue;
        if (activityValue || pendingValue) empty.hidden = true;
        done.hidden = !doneValue || !last || last.user || !!activityValue || !!pendingValue;
        if (reset && data.top === true) scroller.scrollTop = 0;
        else if (atBottom) scroller.scrollTop = scroller.scrollHeight;
        else if (anchor && anchor.isConnected) scroller.scrollTop = oldTop + anchor.getBoundingClientRect().top - anchorOffset;
        else scroller.scrollTop = oldTop;
        scroller.scrollLeft = oldLeft;
    }

    document.addEventListener('click', function (event) {
        const link = event.target.closest('a');
        if (!link) return;
        event.preventDefault();
        if (!event.isTrusted) return;
        const href = safeUrl(link.getAttribute('href'));
        if (href && href.indexOf('vsm-attachment:') === 0) send('attachment', href.substring(15));
        else if (href) send('link', href);
    });
    document.addEventListener('auxclick', function (event) { if (event.target.closest('a')) event.preventDefault(); });
    document.addEventListener('dragstart', function (event) { event.preventDefault(); });
    window.chrome.webview.addEventListener('message', function (event) {
        try { if (event.data && event.data.type === 'render') render(event.data); }
        catch (error) { send('error', String(error.message || error).slice(0, 1024)); }
    });
    window.chrome.webview.postMessage({ type: 'ready' });
})();
</script>
</body>
</html>
